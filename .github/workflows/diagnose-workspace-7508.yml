name: diagnose workspace 7508

on:
  push:
    branches:
      - ci/diagnose-workspace-7508

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packaged test
            command: pnpm --filter @open-design/packaged test
          - name: tools pack test
            command: pnpm --filter @open-design/tools-pack test
          - name: packaged launcher e2e
            command: pnpm --filter @open-design/e2e test tests/packaged-launcher-update-loop.test.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          runner-labels: '["ubuntu-24.04"]'

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
